<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý mã — Zalo Work Digest</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --ink:#122033; --muted:#607182; --line:#d5e0ea; --accent:#1a86ff; --ok:#0d9f6e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .grid { display: grid; gap: 16px; grid-template-columns: 340px 1fr; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    label { display: block; margin: 10px 0; font-size: .92rem; }
    input, select, button { font: inherit; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button { border: 0; background: var(--accent); color: #fff; padding: 9px 14px; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #e8eef5; color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    code { font-size: .75rem; word-break: break-all; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e8eef5; font-size: .78rem; }
    .badge.ok { background: #e5f8f0; color: var(--ok); }
    .badge.warn { background: #fff4e5; color: #b86a08; }
    .badge.bad { background: #fdeceb; color: #c9372c; }
    .hint { color: var(--muted); font-size: .85rem; }
    .msg { margin-top: 10px; min-height: 1.2em; }
    .hidden { display: none !important; }
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(380px, 100%); }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form class="card login-card" id="loginForm">
      <h1>Đăng nhập quản trị</h1>
      <p class="sub">Quản lý mã kích hoạt trên Vercel</p>
      <label>Mật khẩu admin
        <input id="password" type="password" required autocomplete="current-password" />
      </label>
      <div class="toolbar"><button type="submit">Đăng nhập</button></div>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <div id="adminView" class="wrap hidden">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <h1>Quản lý mã kích hoạt</h1>
        <p class="sub">Tạo mã → khách kích hoạt (ghi IP + máy) → thu hồi / xóa để khóa app</p>
      </div>
      <button type="button" class="secondary" id="logoutBtn">Đăng xuất</button>
    </div>
    <div class="grid">
      <div class="card">
        <h2 style="margin:0 0 8px;font-size:1.05rem">Tạo mã mới</h2>
        <label>Loại
          <select id="type">
            <option value="trial">Dùng thử</option>
            <option value="lifetime">Vĩnh viễn</option>
          </select>
        </label>
        <label>Số ngày dùng thử
          <select id="days">
            <option value="3">3 ngày</option>
            <option value="5" selected>5 ngày</option>
            <option value="7">7 ngày</option>
            <option value="14">14 ngày</option>
            <option value="30">30 ngày</option>
          </select>
        </label>
        <label>Tên khách / Zalo<input id="customer" placeholder="VD: Anh Hải — 09xx" /></label>
        <label>Ghi chú<input id="note" placeholder="Gói trial / VIP..." /></label>
        <label>Số máy tối đa<input id="maxDevices" type="number" min="1" max="10" value="1" /></label>
        <label>Số lượng<input id="count" type="number" min="1" max="50" value="1" /></label>
        <div class="toolbar"><button type="button" id="createBtn">Tạo mã</button></div>
        <p class="hint">Cần Upstash Redis trên Vercel để lưu IP, chống share key, thu hồi/xóa.</p>
        <div class="msg" id="createMsg"></div>
      </div>
      <div class="card">
        <div class="toolbar" style="margin-top:0;justify-content:space-between;align-items:center">
          <h2 style="margin:0;font-size:1.05rem">Danh sách</h2>
          <div class="toolbar" style="margin:0">
            <input id="q" placeholder="Tìm…" style="width:160px" />
            <select id="statusFilter" style="width:auto">
              <option value="">Tất cả</option>
              <option value="issued">Đã tạo</option>
              <option value="sold">Đã bán</option>
              <option value="revoked">Thu hồi</option>
            </select>
            <button type="button" class="secondary" id="refreshBtn">Tải lại</button>
          </div>
        </div>
        <div style="overflow:auto;max-height:70vh;margin-top:12px">
          <table>
            <thead><tr><th>Khách</th><th>Loại</th><th>TT</th><th>Kích hoạt / IP</th><th>Mã</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const LOCAL_KEY = "zwd_license_vault_v1";

    function readLocal() {
      try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }
      catch { return []; }
    }
    function writeLocal(rows) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(rows.slice(0, 500)));
    }
    function upsertLocal(rows) {
      const map = new Map(readLocal().map(r => [r.id, r]));
      for (const r of rows) map.set(r.id, r);
      const next = [...map.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      writeLocal(next);
      return next;
    }
    function patchLocal(id, status) {
      const rows = readLocal().map(r => r.id === id ? { ...r, status, updatedAt: Date.now() } : r);
      writeLocal(rows);
      return rows;
    }

    async function api(url, opts = {}) {
      const r = await fetch(url, { credentials: "same-origin", headers: { "content-type": "application/json" }, ...opts });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) {
        showLogin();
        throw new Error(data.error || "Cần đăng nhập");
      }
      if (!r.ok) throw new Error(data.error || "Lỗi");
      return data;
    }
    function showLogin() {
      $("#loginView").classList.remove("hidden");
      $("#adminView").classList.add("hidden");
    }
    function showAdmin() {
      $("#loginView").classList.add("hidden");
      $("#adminView").classList.remove("hidden");
    }
    function badge(status) {
      const cls = status === "sold" ? "ok" : status === "revoked" ? "bad" : "warn";
      const label = status === "sold" ? "Đã bán" : status === "revoked" ? "Thu hồi" : "Đã tạo";
      return `<span class="badge ${cls}">${label}</span>`;
    }
    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function formatActs(row) {
      const acts = Array.isArray(row.activations) ? row.activations : [];
      if (!acts.length) {
        return row.lastIp
          ? `<div class="hint">IP gần nhất: <code>${escapeHtml(row.lastIp)}</code></div>`
          : `<span class="hint">Chưa kích hoạt</span>`;
      }
      return acts.map(a => {
        const when = a.lastSeenAt || a.at;
        return `<div style="margin-bottom:6px">
          <div><code>${escapeHtml(a.ip || "?")}</code> · ${escapeHtml(a.hostname || "máy")}</div>
          <div class="hint">${when ? new Date(when).toLocaleString("vi-VN") : ""} · ${escapeHtml(String(a.machineId || "").slice(0, 8))}…</div>
        </div>`;
      }).join("");
    }
    function filterRows(rows) {
      const q = $("#q").value.trim().toLowerCase();
      const st = $("#statusFilter").value;
      return rows.filter(row => {
        if (st && row.status !== st) return false;
        if (!q) return true;
        const hay = [row.customer, row.note, row.key, row.id, row.type, row.lastIp, ...(row.activations || []).map(a => a.ip)].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }
    function renderRows(rows) {
      const list = filterRows(rows);
      $("#rows").innerHTML = list.map(row => `
        <tr>
          <td><b>${escapeHtml(row.customer || "—")}</b><div class="hint">${escapeHtml(row.note || "")}<br>${new Date(row.createdAt).toLocaleString("vi-VN")}</div></td>
          <td>${row.type === "lifetime" ? "Vĩnh viễn" : `Trial ${row.days}d`}<div class="hint">≤${row.maxDevices || 1} máy</div></td>
          <td>${badge(row.status)}</td>
          <td>${formatActs(row)}</td>
          <td><code>${escapeHtml(row.key || "")}</code></td>
          <td>
            <div class="toolbar" style="margin:0">
              <button type="button" class="secondary" data-copy="${escapeHtml(row.key)}">Copy</button>
              <button type="button" class="secondary" data-status="sold" data-id="${row.id}">Đã bán</button>
              <button type="button" class="secondary" data-status="revoked" data-id="${row.id}">Thu hồi</button>
              <button type="button" class="secondary" data-delete="${row.id}">Xóa</button>
            </div>
          </td>
        </tr>`).join("") || `<tr><td colspan="6">Chưa có mã</td></tr>`;
      $("#rows").querySelectorAll("[data-copy]").forEach(btn => btn.onclick = async () => {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = "OK";
        setTimeout(() => btn.textContent = "Copy", 1000);
      });
      $("#rows").querySelectorAll("[data-status]").forEach(btn => btn.onclick = async () => {
        try {
          await api(`/api/licenses/${encodeURIComponent(btn.dataset.id)}`, {
            method: "PATCH", body: JSON.stringify({ status: btn.dataset.status })
          });
        } catch (err) {
          $("#createMsg").textContent = err.message;
          return;
        }
        await load();
      });
      $("#rows").querySelectorAll("[data-delete]").forEach(btn => btn.onclick = async () => {
        if (!confirm("Xóa mã này? App khách sẽ không kích hoạt / heartbeat được nữa.")) return;
        try {
          await api(`/api/licenses/${encodeURIComponent(btn.dataset.delete)}`, { method: "DELETE" });
          writeLocal(readLocal().filter(r => r.id !== btn.dataset.delete));
          await load();
        } catch (err) {
          $("#createMsg").textContent = err.message;
        }
      });
    }
    async function load() {
      try {
        const data = await api(`/api/licenses`);
        if (data.warning) {
          $("#createMsg").textContent = data.warning;
        }
        const rows = Array.isArray(data.keys) ? data.keys : [];
        writeLocal(rows);
        renderRows(rows);
      } catch (err) {
        $("#createMsg").textContent = err.message;
        renderRows(readLocal());
      }
    }

    $("#loginForm").onsubmit = async (e) => {
      e.preventDefault();
      $("#loginMsg").textContent = "";
      try {
        await api("/api/auth", { method: "POST", body: JSON.stringify({ password: $("#password").value }) });
        showAdmin();
        await load();
      } catch (err) {
        $("#loginMsg").textContent = err.message;
      }
    };
    $("#logoutBtn").onclick = async () => {
      await api("/api/auth", { method: "DELETE" }).catch(() => {});
      showLogin();
    };
    $("#createBtn").onclick = async () => {
      $("#createMsg").textContent = "Đang tạo…";
      try {
        const data = await api("/api/licenses", {
          method: "POST",
          body: JSON.stringify({
            type: $("#type").value,
            days: Number($("#days").value),
            customer: $("#customer").value,
            note: $("#note").value,
            count: Number($("#count").value) || 1,
            maxDevices: Number($("#maxDevices").value) || 1
          })
        });
        const issued = data.issued || [];
        if (issued.length) upsertLocal(issued);
        const first = issued[0];
        if (first?.key) await navigator.clipboard.writeText(first.key).catch(() => {});
        let msg = `Đã tạo ${issued.length} mã (đã lưu cloud)` + (first ? " & copy clipboard." : ".");
        if (first?.key) msg += `\n${first.key}`;
        $("#createMsg").textContent = msg;
        $("#customer").value = "";
        await load();
      } catch (err) {
        $("#createMsg").textContent = err.message;
      }
    };
    $("#type").onchange = () => { $("#days").disabled = $("#type").value === "lifetime"; };
    $("#refreshBtn").onclick = () => load();
    $("#q").oninput = () => renderRows(readLocal());
    $("#statusFilter").onchange = () => renderRows(readLocal());

    api("/api/licenses").then(() => { showAdmin(); return load(); }).catch(() => showLogin());
  </script>
</body>
</html>
