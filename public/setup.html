<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiết lập Zalo Work Digest</title>
  <link rel="icon" type="image/png" href="/images/app-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/settings.css">
  <style>
    body.setup-page {
      min-height: 100vh;
      margin: 0;
      display: grid;
      /* styles.css sets body to sidebar + main (268px 1fr); reset for standalone setup. */
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 24px 16px;
      background: linear-gradient(160deg, #e8f1fb 0%, #f7fafc 45%, #eef6f1 100%);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .setup-card {
      width: min(560px, 92vw);
      background: #fff;
      border: 1px solid #d5e0ea;
      border-radius: 16px;
      padding: 28px 26px 22px;
      box-shadow: 0 18px 40px rgba(23, 62, 122, 0.08);
    }
    .setup-card h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      color: #173e7a;
    }
    .setup-card p { color: #475467; line-height: 1.5; }
    .setup-card .toolbar { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
  <script>
    (function () {
      var k = "zalo-digest-ui-scale";
      var s = localStorage.getItem(k);
      if (s) document.documentElement.style.zoom = s;
    })();
  </script>
</head>
<body class="setup-page">
  <div class="setup-card form">
    <h1>Chọn nơi lưu dữ liệu</h1>
    <p>Lần đầu mở app, hãy chọn thư mục lưu nhóm, tin nhắn, lịch và cấu hình. Có thể đổi lại sau trong Cài đặt.</p>
    <label>Đường dẫn thư mục
      <input id="dataLocationPath" type="text" spellcheck="false" placeholder="Ví dụ: D:\ZaloDigestData">
    </label>
    <p class="hint" id="dataLocationHint">Đang tải…</p>
    <div class="toolbar">
      <button id="browseDataLocation" type="button" class="secondary">Chọn thư mục</button>
      <button id="saveDataLocation" type="button">Bắt đầu sử dụng</button>
      <button id="resetDataLocation" type="button" class="secondary">Dùng mặc định</button>
    </div>
    <div id="dataLocationNotice"></div>
  </div>
  <script>
    const $ = s => document.querySelector(s);
    async function api(url, options = {}) {
      const res = await fetch(url, { headers: { "content-type": "application/json" }, ...options });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
      if (!res.ok) throw new Error(data?.error || text || res.statusText);
      return data;
    }
    async function load() {
      const info = await api("/api/data-location");
      $("#dataLocationPath").value = info.defaultPath || info.path || "";
      $("#dataLocationHint").textContent = `Mặc định đề xuất: ${info.defaultPath}`;
    }
    async function apply({ useDefault = false } = {}) {
      $("#dataLocationNotice").textContent = "Đang lưu…";
      const body = useDefault ? { useDefault: true } : { path: $("#dataLocationPath").value };
      const info = await api("/api/data-location", { method: "POST", body: JSON.stringify(body) });
      $("#dataLocationNotice").textContent = info.message || "Xong.";
      location.href = "/";
    }
    $("#browseDataLocation").onclick = async () => {
      try {
        $("#dataLocationNotice").textContent = "Đang mở hộp thoại…";
        const result = await api("/api/data-location/browse", { method: "POST", body: "{}" });
        if (result.path) $("#dataLocationPath").value = result.path;
        $("#dataLocationNotice").textContent = result.path ? "Đã chọn thư mục." : "Đã hủy.";
      } catch (e) {
        $("#dataLocationNotice").textContent = e.message;
      }
    };
    $("#saveDataLocation").onclick = () => apply().catch(e => { $("#dataLocationNotice").textContent = e.message; });
    $("#resetDataLocation").onclick = () => apply({ useDefault: true }).catch(e => { $("#dataLocationNotice").textContent = e.message; });
    load().catch(e => { $("#dataLocationHint").textContent = e.message; });
  </script>
</body>
</html>
